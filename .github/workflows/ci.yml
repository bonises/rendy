# Build + test on every push/PR: GCC and Clang, debug/release, plus an
# ASan/UBSan job. Everything here is CPU-only — the test suite needs no GPU,
# and volk loads libvulkan at runtime, so no Vulkan SDK is installed.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.compiler }} ${{ matrix.preset }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release]
        include:
          - compiler: gcc
            preset: asan

    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}

    steps:
      - uses: actions/checkout@v4

      # SDL3 builds from source (FetchContent) and needs the X11/audio dev
      # headers; the video/audio backends are never opened by the tests.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            fonts-dejavu-core

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.compiler }}-${{ matrix.preset }}-

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DRENDY_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: ccache stats
        if: always()
        run: ccache -s
